<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログ絞り込み</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f2;color:#122a27;font:16px system-ui,sans-serif}main{width:min(94%,820px);margin:6vh auto;background:white;padding:clamp(1rem,5vw,2.5rem);border:1px solid #b8cec9;border-radius:18px}h1{margin:0}p{line-height:1.6}form,label{display:grid;gap:.55rem}form{gap:1rem;margin:1.5rem 0}input,textarea,select,button{font:inherit;color:inherit;padding:.65rem;border:1px solid #65847f;border-radius:8px;min-width:0}textarea{resize:vertical;font-family:monospace}button{background:#16534a;color:white;cursor:pointer}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><main><h1>ログ絞り込み</h1><p>貼り付けたログからキーワードを含む行と、その前後の行を行番号付きで抽出します。</p>
<form><label>ログ<textarea name="log" rows="9" maxlength="500000" required></textarea></label>
<label>キーワード<input name="query" required></label><label>前後の行数<input name="context" type="number" min="0" max="20" value="1" required></label><button>抽出する</button></form><output aria-live="polite"></output></main>
<script>

function sliceLog(log, query, context) {
  const lines = log.split(/\r\n|\n|\r/);
  const visible = new Set();
  let matches = 0;
  lines.forEach((line, index) => {
    if (!line.toLowerCase().includes(query)) return;
    matches++;
    for (let row = Math.max(0, index-context); row <= Math.min(lines.length-1, index+context); row++) {
      visible.add(row);
    }
  });
  return {matches, rows:lines.flatMap((line,index)=>visible.has(index)?[(index+1)+'  '+line]:[])};
}
function run(fields) {
  const query = fields.get('query').trim().toLowerCase();
  if (!query) throw Error('キーワードを入力してください。');
  const {matches, rows} = sliceLog(fields.get('log'), query, Number(fields.get('context')));
  return [matches+'件一致', ...rows].join('\n');
}
const form = document.querySelector('form');
const output = document.querySelector('output');
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = form.querySelector('button');
  const fields = new FormData(form);
  button.disabled = true;
  try { output.textContent = await run(fields); }
  catch (error) { output.textContent = error.message; }
  finally { button.disabled = false; }
});
</script></body></html>
