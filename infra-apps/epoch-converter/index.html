<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unix時刻変換</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f2;color:#122a27;font:16px system-ui,sans-serif}main{width:min(94%,820px);margin:6vh auto;background:white;padding:clamp(1rem,5vw,2.5rem);border:1px solid #b8cec9;border-radius:18px}h1{margin:0}p{line-height:1.6}form,label{display:grid;gap:.55rem}form{gap:1rem;margin:1.5rem 0}input,textarea,select,button{font:inherit;color:inherit;padding:.65rem;border:1px solid #65847f;border-radius:8px;min-width:0}textarea{resize:vertical;font-family:monospace}button{background:#16534a;color:white;cursor:pointer}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><main><h1>Unix時刻変換</h1><p>Unix時刻の秒・ミリ秒と、UTC・日本時間を相互に確認できます。日時から変換するときはタイムゾーンも入力します。</p>
<form><label>入力形式<select name="mode"><option value="seconds">Unix秒</option><option value="milliseconds">Unixミリ秒</option><option value="iso">ISO 8601</option></select></label>
<label>時刻<input name="value" value="0" required placeholder="2026-11-24T15:00:00+09:00"></label><button>変換する</button></form><output aria-live="polite"></output></main>
<script>

function toDate(value, mode) {
  if (mode === 'iso') {
    const match = /^(\d{4}-\d{2}-\d{2})T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d{1,3})?(?:Z|[+-](?:[01]\d|2[0-3]):[0-5]\d)$/.exec(value);
    const day = match && new Date(match[1]+'T00:00:00Z');
    if (!day || !Number.isFinite(day.getTime()) || day.toISOString().slice(0,10)!==match[1]) {
      throw Error('2026-11-24T15:00:00+09:00 の形式で、有効な日付を入力してください。');
    }
  } else if (!/^-?\d+$/.test(value)) {
    throw Error('整数のUnix時刻を入力してください。');
  }
  const date = mode==='iso' ? new Date(value) : new Date(Number(value)*(mode==='seconds'?1000:1));
  if (!Number.isFinite(date.getTime())) throw Error('変換できる日時の範囲を超えています。');
  return date;
}
function run(fields) {
  const date = toDate(fields.get('value').trim(), fields.get('mode'));
  const jst = new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',dateStyle:'long',timeStyle:'medium'});
  return ['UTC  '+date.toISOString(),'日本時間  '+jst.format(date),'Unix秒  '+date.getTime()/1000,'Unixミリ秒  '+date.getTime()].join('\n');
}
const form = document.querySelector('form');
const output = document.querySelector('output');
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = form.querySelector('button');
  const fields = new FormData(form);
  button.disabled = true;
  try { output.textContent = await run(fields); }
  catch (error) { output.textContent = error.message; }
  finally { button.disabled = false; }
});
</script></body></html>
