<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファイルのSHA-256照合</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f2;color:#122a27;font:16px system-ui,sans-serif}main{width:min(94%,820px);margin:6vh auto;background:white;padding:clamp(1rem,5vw,2.5rem);border:1px solid #b8cec9;border-radius:18px}h1{margin:0}p{line-height:1.6}form,label{display:grid;gap:.55rem}form{gap:1rem;margin:1.5rem 0}input,textarea,select,button{font:inherit;color:inherit;padding:.65rem;border:1px solid #65847f;border-radius:8px;min-width:0}textarea{resize:vertical;font-family:monospace}button{background:#16534a;color:white;cursor:pointer}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><main><h1>ファイルのSHA-256照合</h1><p>ファイルのSHA-256を端末内で計算し、配布元が示したハッシュ値と照合します。上限は64 MiBです。</p>
<form><label>確認するファイル<input name="file" type="file" required></label>
<label>比較するSHA-256（省略可）<input name="expected" placeholder="64桁の16進数"></label><button>ハッシュを計算する</button></form><output aria-live="polite"></output></main>
<script>

async function sha256(data) {
  const digest = await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,'0')).join('');
}
async function run(fields) {
  const file = fields.get('file');
  const expected = fields.get('expected').trim().toLowerCase();
  if (expected && !/^[a-f0-9]{64}$/.test(expected)) throw Error('SHA-256を64桁の16進数で入力してください。');
  if (file.size>64*1024*1024) throw Error('64 MiB以下のファイルを選んでください。');
  if (!globalThis.crypto?.subtle) throw Error('HTTPSまたはlocalhostでこのページを開いてください。');
  const actual = await sha256(await file.arrayBuffer());
  return actual+(expected ? '\n'+(expected===actual?'一致しました。':'ハッシュ値が一致しません。') : '');
}
const form = document.querySelector('form');
const output = document.querySelector('output');
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = form.querySelector('button');
  const fields = new FormData(form);
  button.disabled = true;
  try { output.textContent = await run(fields); }
  catch (error) { output.textContent = error.message; }
  finally { button.disabled = false; }
});
</script></body></html>
